name: Release APK

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'v')
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION_BRANCH: ${{ github.event.pull_request.head.ref }}
      RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check prepared release
        id: version
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          python3 scripts/release_ci.py "$VERSION_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Decode keystore
        run: |
          test -n "$ANDROID_SIGNING_KEY_BASE64"
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signing key
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          signing_sha256=$("$apksigner" verify --print-certs app/build/outputs/apk/release/zaelio.apk | sed -n 's/.*SHA-256 digest: //p')
          expected_sha256=$(awk '/AllowedAPKSigningKeys:/ { sub(/.*AllowedAPKSigningKeys:[[:space:]]*/, ""); if ($0 != "") { print; exit } getline; gsub(/^[[:space:]-]*/, ""); print; exit }' docs/fdroiddata/com.zaelio.app.yml)
          test "$signing_sha256" = "$expected_sha256"
          {
            cat CHANGELOG.md
            # Literal Markdown fences, not shell substitution.
            # shellcheck disable=SC2016
            printf '\n## APK signing certificate\n\n```text\n%s\n```\n' "$signing_sha256"
          } > release-notes.md
          echo "APK signing certificate SHA-256: $signing_sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag merged commit and publish release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$RELEASE_SHA" ]; then
              echo "::error::Release tag already points to another commit; refusing to overwrite it"
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" app/build/outputs/apk/release/zaelio.apk --clobber
          else
            gh release create "$RELEASE_TAG" \
              app/build/outputs/apk/release/zaelio.apk \
              --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
          fi

      - name: Update F-Droid metadata from current main
        run: |
          git fetch origin main
          git checkout -B release-metadata origin/main
          python3 scripts/release_ci.py "$VERSION_BRANCH" --metadata-commit "$RELEASE_SHA"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fdroid-${{ steps.version.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/fdroiddata/com.zaelio.app.yml
          if-no-files-found: error

      - name: Commit F-Droid metadata to main
        run: |
          git add docs/fdroiddata/com.zaelio.app.yml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Update F-Droid metadata for $VERSION_BRANCH"
            git push origin HEAD:refs/heads/main
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

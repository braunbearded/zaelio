name: Version branch tests

on:
  push:
    branches:
      - "v[0-9]+.[0-9]+.[0-9]+**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
